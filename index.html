<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Chord Cycle — play a chord wheel with your hands</title>
    <meta
      name="description"
      content="A configurable chord wheel played with hand gestures: point to pick a chord, open your hand to swell."
    />
  </head>
  <body>
    <main class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="canvas"></canvas>

      <div class="hud">
        <div class="hud-cell">
          <span class="hud-label">Chord</span>
          <span class="hud-value" id="hud-chord">—</span>
        </div>
        <div class="hud-cell">
          <span class="hud-label">% Open</span>
          <span class="hud-value" id="hud-open">0%</span>
        </div>
        <div class="hud-cell">
          <span class="hud-label">Notes</span>
          <span class="hud-value hud-value--small" id="hud-notes">—</span>
        </div>
      </div>

      <div class="start-overlay" id="start-overlay">
        <div class="start-card">
          <h1>Chord Cycle</h1>
          <p>
            Point your hand at a wedge to pick the chord. Open your hand to swell,
            close it to fade out. Pinch to latch the current chord.
          </p>
          <button id="start-button" type="button">Enable camera &amp; audio</button>
          <p class="start-status" id="start-status"></p>
        </div>
      </div>

      <button class="panel-toggle" id="panel-toggle" type="button" aria-expanded="false">Wheel</button>
    </main>

    <aside class="panel" id="panel" hidden>
      <section>
        <h2>Wheel</h2>
        <label class="field">
          <span>Preset</span>
          <select id="preset-select"></select>
        </label>
        <p class="preset-note" id="preset-note"></p>
        <div class="slots" id="slots"></div>
        <div class="row">
          <button id="add-slot" type="button">Add slot</button>
          <button id="copy-link" type="button">Copy share link</button>
        </div>
      </section>

      <section>
        <h2>Sound</h2>
        <label class="field"><span>Volume</span><input id="s-master" type="range" min="0" max="1" step="0.01" /></label>
        <label class="field"><span>Reverb</span><input id="s-reverb" type="range" min="0" max="0.9" step="0.01" /></label>
        <label class="field"><span>Brightness</span><input id="s-bright" type="range" min="800" max="9000" step="50" /></label>
        <label class="field"><span>Detune</span><input id="s-detune" type="range" min="0" max="24" step="1" /></label>
        <label class="field field--check"><span>Bass note</span><input id="s-bass" type="checkbox" /></label>
      </section>

      <section>
        <h2>Feel</h2>
        <label class="field"><span>Edge margin</span><input id="s-margin" type="range" min="0" max="0.6" step="0.01" /></label>
        <label class="field"><span>Dwell (ms)</span><input id="s-dwell" type="range" min="0" max="400" step="10" /></label>
        <label class="field"><span>Min hold (ms)</span><input id="s-hold" type="range" min="0" max="600" step="10" /></label>
        <p class="hint">
          Raise these if chords flicker as you cross a boundary; lower them if the
          wheel feels sluggish.
        </p>
        <button id="reset-config" type="button">Reset to defaults</button>
      </section>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
