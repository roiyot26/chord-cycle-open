<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Chord Cycle — play a chord wheel with your hands</title>
    <meta
      name="description"
      content="A chord wheel you play in the browser. Point or touch a wedge to pick a chord; move out from the center to swell."
    />
  </head>
  <body>
    <main class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="canvas"></canvas>

      <div class="chrome">
        <button class="hands-button" id="hands-button" type="button" aria-pressed="false">
          Use hands
        </button>
        <span class="hands-status" id="hands-status"></span>
        <button class="panel-toggle" id="panel-toggle" type="button" aria-expanded="false">Edit</button>
      </div>
    </main>

    <aside class="panel" id="panel" hidden>
      <section>
        <h2>Wheel</h2>
        <label class="field">
          <span>Preset</span>
          <select id="preset-select"></select>
        </label>
        <p class="preset-note" id="preset-note"></p>
        <div class="slots" id="slots"></div>
        <div class="row">
          <button id="add-slot" type="button">Add slot</button>
          <button id="copy-link" type="button">Copy share link</button>
        </div>
      </section>

      <section>
        <h2>Sound</h2>
        <label class="field"><span>Volume</span><input id="s-master" type="range" min="0" max="1" step="0.01" /></label>
        <label class="field"><span>Reverb</span><input id="s-reverb" type="range" min="0" max="0.9" step="0.01" /></label>
        <label class="field"><span>Brightness</span><input id="s-bright" type="range" min="800" max="9000" step="50" /></label>
        <label class="field"><span>Detune</span><input id="s-detune" type="range" min="0" max="24" step="1" /></label>
        <label class="field field--check"><span>Bass note</span><input id="s-bass" type="checkbox" /></label>
        <button id="reset-config" type="button">Reset to defaults</button>
      </section>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
